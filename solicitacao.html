<!-- Portal de solicitação NOVO (23/11/2026, lote 4 da lista de 16/11). Desenho aprovado no protótipo de 13/11.
     Usa as mesmas rotas e regras do portal atual (solicitacao.html); no dia da troca, este arquivo passa a ser
     o solicitacao.html e o antigo fica guardado como reserva. NÃO publicar antes da reunião com a operação. -->
<style>
[hidden]{display:none!important}   /* o "escondido" vale mesmo em quem tem display próprio (24/11/2026) */
/* Layout: app de uma tela — barra de cima, conteúdo que rola, barra do pedido e menu embaixo (no computador o menu sobe e o pedido fica ao lado). */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f8fafc; --sel:#f5f6ff; --line:#e2e8f0; --line-2:#cbd5e1;
  --fg:#0f172a; --fg-2:#334155; --fg-3:#475569;
  --accent:#4f46e5; --accent-fg:#ffffff; --accent-soft:#eef2ff; --accent-text:#4338ca;
  --near:#155e75; --near-bg:#ecfeff; --near-chip:#cffafe; --near-line:#0891b2;
  --main-bg:#e0e7ff; --main-text:#3730a3;
  --ok:#166534; --ok-bg:#f0fdf4; --ok-line:#86efac; --ok-dot:#16a34a;
  --warn:#92400e; --warn-bg:#fffbeb; --warn-line:#fcd34d;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fca5a5;
  --off-bg:#e2e8f0; --off-text:#475569;
  --shadow:0 6px 18px rgba(15,23,42,.08);
  --f:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0f; --surface:#0f0f17; --surface-2:#12121b; --sel:#12122a; --line:#1e1e2e; --line-2:#2a2a3e;
  --fg:#f1f5f9; --fg-2:#cbd5e1; --fg-3:#94a3b8;
  --accent:#6366f1; --accent-fg:#ffffff; --accent-soft:#1e1b4b; --accent-text:#a5b4fc;
  --near:#67e8f9; --near-bg:#062a33; --near-chip:#062a33; --near-line:#22d3ee;
  --main-bg:#16162a; --main-text:#c7d2fe;
  --ok:#86efac; --ok-bg:#07160d; --ok-line:#14532d; --ok-dot:#22c55e;
  --warn:#fcd34d; --warn-bg:#1c1300; --warn-line:#5c4207;
  --bad:#fca5a5; --bad-bg:#1c0a0a; --bad-line:#7f1d1d;
  --off-bg:#1e1e2e; --off-text:#94a3b8;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0a0f; --surface:#0f0f17; --surface-2:#12121b; --sel:#12122a; --line:#1e1e2e; --line-2:#2a2a3e;
  --fg:#f1f5f9; --fg-2:#cbd5e1; --fg-3:#94a3b8;
  --accent:#6366f1; --accent-fg:#ffffff; --accent-soft:#1e1b4b; --accent-text:#a5b4fc;
  --near:#67e8f9; --near-bg:#062a33; --near-chip:#062a33; --near-line:#22d3ee;
  --main-bg:#16162a; --main-text:#c7d2fe;
  --ok:#86efac; --ok-bg:#07160d; --ok-line:#14532d; --ok-dot:#22c55e;
  --warn:#fcd34d; --warn-bg:#1c1300; --warn-line:#5c4207;
  --bad:#fca5a5; --bad-bg:#1c0a0a; --bad-line:#7f1d1d;
  --off-bg:#1e1e2e; --off-text:#94a3b8;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* App instalado no iPhone (25/11/2026): a página ocupa a tela toda, inclusive embaixo da barra do relógio; o app fica
   preso à tela (não sobra espaço embaixo) e o primeiro bloco reserva a área do relógio e da câmera (safe-area) */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:100%}
.faixa{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--warn-line);font-size:12px;font-weight:600;text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.faixa a{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--warn-line);background:var(--surface);color:var(--warn);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.topo{flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:calc(60px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.faixa ~ .topo{min-height:60px;padding-top:0}
.topo img{height:26px;width:auto}
.topo .t{display:flex;flex-direction:column;min-width:0;flex:1}
.topo .t b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .t small{font-size:11px;color:var(--fg-3);font-weight:600;letter-spacing:.3px}
.topo .t small.passo{color:var(--accent-text)}
.btn-ic{width:44px;height:44px;border-radius:999px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--fg-2);flex-shrink:0}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--line-2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-pc{display:none}
.conteudo{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.nav{flex-shrink:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.nav button{height:64px;border:none;background:transparent;color:var(--fg-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.nav button[aria-current="page"]{color:var(--accent-text);font-weight:700}
.nav .bolha{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.barra-pedido{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--sel);border-top:1px solid var(--line-2)}
.barra-pedido .info{display:flex;flex-direction:column;flex:1;min-width:0}
.barra-pedido .info b{font-size:15px}
.barra-pedido .info span{font-size:12px;color:var(--near);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1{margin:0;font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance}
h2{margin:0;font-size:13px;font-weight:700;color:var(--fg-3);letter-spacing:.5px;text-transform:uppercase}
p{margin:0}
.muted{color:var(--fg-3);font-size:13px;line-height:1.45}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-text);letter-spacing:.5px;text-transform:uppercase}
.btn{height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.peq{height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.grande{height:54px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.seg button{height:42px;border-radius:9px;border:none;background:transparent;color:var(--fg-3);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.busca{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface)}
.busca input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo .rot{font-size:13px;font-weight:600;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.campo input,.campo select,.campo textarea{height:48px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:16px;width:100%}
.campo textarea{height:auto;padding:10px 12px;resize:vertical}
.campo .dica{font-size:12px;color:var(--fg-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lista{display:flex;flex-direction:column;gap:8px}
.linha{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;min-height:56px}
.linha .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.linha .tx b{font-size:15px;font-weight:600}
.linha .tx span{font-size:12px;color:var(--fg-3)}
.aviso{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.aviso svg{flex-shrink:0;margin-top:1px}
.aviso.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.aviso.info{background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg-2)}
.aviso.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}
.aviso.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* Acompanhar (24/11/2026): painel com os totais e a lista do grupo escolhido */
.ac-total{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.ac-total .n{font-size:34px;font-weight:800;color:var(--accent-text);min-width:58px;text-align:center;line-height:1}
.ac-total .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.ac-total b{font-size:16px}
.ac-total small,.ac-card small{font-size:12px;color:var(--fg-3);font-weight:500;line-height:1.3}
.ac-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ac-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;color:var(--fg);font:inherit;cursor:pointer;min-height:122px}
.ac-card .n{font-size:28px;font-weight:800;line-height:1.05}
.ac-card b{font-size:14px}
.ac-ic{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.ac-card.warn .ac-ic{background:var(--warn-bg);color:var(--warn)}.ac-card.warn .n{color:var(--warn)}
.ac-card.acc .ac-ic{background:var(--accent-soft);color:var(--accent-text)}.ac-card.acc .n{color:var(--accent-text)}
.ac-card.near .ac-ic{background:var(--near-bg);color:var(--near)}.ac-card.near .n{color:var(--near)}
.ac-card.ok .ac-ic{background:var(--ok-bg);color:var(--ok)}.ac-card.ok .n{color:var(--ok)}
.ac-card.bad .ac-ic{background:var(--bad-bg);color:var(--bad)}.ac-card.bad .n{color:var(--bad)}
.ac-card[data-vazio] .n{color:var(--fg-3)}
.ac-total:hover,.ac-card:hover{border-color:var(--line-2)}
@media (max-width:719px){.ac-card.bad{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:12px}.ac-card.bad .ac-ic{margin:0;grid-row:1/3}.ac-card.bad .n{grid-row:1/3}.ac-card.bad small{grid-column:3}}
@media (min-width:720px){.ac-grade{grid-template-columns:repeat(5,1fr)}}
.ac-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px 2px}
.ac-chips::-webkit-scrollbar{display:none}
.ac-chips .chip{flex-shrink:0}
.busca .limpar[hidden]{display:none}
.busca .limpar{width:32px;height:32px;border:none;background:transparent;color:var(--fg-3);display:flex;align-items:center;justify-content:center;border-radius:999px;flex-shrink:0}
.chip{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg-2);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.saldo{height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
.saldo.perto{background:var(--near-chip);color:var(--near)}
.saldo.princ{background:var(--main-bg);color:var(--main-text)}
.saldo.zero{background:var(--off-bg);color:var(--off-text);font-weight:600}
.saldo small{font-weight:500;opacity:.85;margin-left:3px}
.arm-sel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.arm-sel button{min-height:56px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px;text-align:center}
.arm-sel button small{font-size:12px;font-weight:600;color:var(--fg-3)}
.arm-sel button[aria-pressed="true"]{border:2px solid var(--near-line);background:var(--near-bg);color:var(--near)}
.arm-sel button[aria-pressed="true"] small{color:var(--near)}
.arm-sel button.princ[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.arm-sel button.princ[aria-pressed="true"] small{color:var(--accent-text)}
.arm-sel button:disabled{opacity:.5;cursor:not-allowed}
.item{border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.item .cab{display:flex;align-items:center;gap:10px;padding:12px;width:100%;border:none;background:transparent;text-align:left}
.item .cab .tx{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.item .cab .tx b{font-size:15px;font-weight:600}
.item .cab .tx .sub{font-size:12px;color:var(--fg-3)}
.item .saldos{display:flex;gap:6px;flex-wrap:wrap}
.item.aberto{border:2px solid var(--accent);background:var(--sel);box-shadow:var(--shadow)}
.item.no-pedido{border-color:var(--ok-line);background:var(--ok-bg)}
.item.indisp{border-style:dashed;background:var(--surface-2)}
.item .corpo{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.item .ok-dot{width:26px;height:26px;border-radius:999px;background:var(--ok-dot);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lin-campo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lin-campo > .rot{font-size:12px;color:var(--fg-2);width:72px;font-weight:600}
.tam{min-width:44px;height:40px;padding:0 8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tam small{font-size:10px;font-weight:600;color:var(--fg-3)}
.tam[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tam[aria-pressed="true"] small{color:var(--accent-fg)}
.tam:disabled{opacity:.4;text-decoration:line-through}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.stepper button{width:44px;height:40px;border:none;background:transparent;font-size:20px;font-weight:600;color:var(--fg-2)}
.stepper button:disabled{opacity:.35}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.sel-inline{flex:1;min-width:150px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;font-size:15px}
.erro-linha{font-size:13px;color:var(--bad);font-weight:600}
.cartao{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.cartao.clic{text-align:left;width:100%}
.grupo-arm{border-radius:var(--r);border:1px solid var(--near-line);overflow:hidden;background:var(--surface)}
.grupo-arm .h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--near-bg);color:var(--near);font-weight:700;font-size:14px}
.grupo-arm.princ{border-color:var(--accent)}
.grupo-arm.princ .h{background:var(--accent-soft);color:var(--accent-text)}
.grupo-arm .l{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.qtd-badge{min-width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;padding:0 6px}
.prio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prio button{height:46px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);font-weight:600}
.prio button[aria-pressed="true"].n{border-color:var(--ok-dot);background:var(--ok-bg);color:var(--ok);font-weight:700}
.prio button[aria-pressed="true"].u{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}
.prio button:disabled{opacity:.5;cursor:not-allowed}
.tempo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
.tempo li{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--fg-3)}
.tempo li i{height:5px;border-radius:99px;background:var(--line-2)}
.tempo li.feito{color:var(--accent-text);font-weight:700}
.tempo li.feito i{background:var(--accent)}
.tag{height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;flex-shrink:0;white-space:nowrap}
.tag.urg{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.tag.can{background:var(--off-bg);color:var(--off-text)}
.tag.mob{background:var(--accent-soft);color:var(--accent-text)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.sucesso{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:28px 8px}
.sucesso .ic{width:64px;height:64px;border-radius:999px;background:var(--ok-bg);color:var(--ok-dot);display:flex;align-items:center;justify-content:center;border:1px solid var(--ok-line)}

  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  try {

    if (r.status === 401 && S.token && !/\/login$/.test(caminho)) { sessaoExpirou(); return { ok: false, erro: j.erro || 'Sessão expirada.' }; }

}

const matNormal = (v) => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, '');
let _mobMatTimer = null;

// Confere a matrícula do novato no servidor: já tem cadastro aqui → muda para "Já cadastrado" com a pessoa escolhida;
// em outra filial, inativa ou com pedido de novato em aberto → bloqueia com o motivo
async function conferirMatricula() {
  const m = S.mob;
  if (!m || m.tipo !== 'NOVATO') return null;
  const valor = matNormal(m.mat);
  if (!valor) { m.matConf = null; m.matMsg = null; atualizarMsgMatricula(); return null; }
  if (m.matConf && m.matConf.valor === valor) return m.matConf;
  m.matMsg = { tipo: 'info', txt: 'Conferindo a matrícula...' }; atualizarMsgMatricula();
  const r = await req('/solicitacao-auth/mobilizacao/matricula?m=' + encodeURIComponent(valor));
  if (S.mob !== m || matNormal(m.mat) !== valor) return null;   // mudou enquanto conferia
  if (!r?.ok) { m.matConf = null; m.matMsg = { tipo: 'erro', txt: r?.erro || 'Não foi possível conferir a matrícula.' }; atualizarMsgMatricula(); return null; }
  m.matConf = { valor, ...r };
  if (r.situacao === 'LIVRE') m.matMsg = { tipo: 'ok', txt: 'Matrícula sem cadastro: segue como novato.' };
  else if (r.situacao === 'CADASTRADO') {
    const c = I.colab.get(r.colaborador.id) || { ...r.colaborador, matricula: r.matricula };
    Object.assign(m, { tipo: 'CADASTRADO', colab: c, matMsg: null, erro: '', colabAviso: `A matrícula ${r.matricula} já tem cadastro. O pedido vai pelo cadastro de ${r.colaborador.nome}.` });
    render(); return m.matConf;

}
async function mobVerKit() {

  m.erro = '';

  if (m.tipo === 'NOVATO') {
    if (!matNormal(m.mat)) { m.erro = 'Informe a matrícula do novato.'; return; }
    const conf = await conferirMatricula();
    if (S.mob !== m) return;
    if (!conf) { m.erro = 'Não foi possível conferir a matrícula. Tente de novo.'; return; }
    if (conf.situacao === 'CADASTRADO') return;   // já mudou para "Já cadastrado": confira e continue
    if (conf.situacao !== 'LIVRE') { m.erro = conf.erro || 'Essa matrícula não pode ser usada.'; return; }
    const nome = m.nome.trim();
    if (nome.length < 5 || !nome.includes(' ')) { m.erro = 'Informe o nome completo do novato.'; return; }
    if (!m.funcao) { m.erro = 'Escolha a função.'; return; }
    if (!m.setor) { m.erro = (S.mobOp?.setores || []).length ? 'Escolha o setor / base.' : 'A filial não tem setor cadastrado. Fale com o almoxarifado.'; return; }
    const tel = m.tel.replace(/\D/g, '');
    if (tel && (tel.length < 10 || tel.length > 13)) { m.erro = 'Telefone inválido: use o DDD e o número, ou deixe em branco.'; return; }
    url = '/solicitacao-auth/mobilizacao/kit?funcao=' + encodeURIComponent(m.funcao);
  } else {
    if (!m.colab) { m.erro = 'Escolha o colaborador na lista.'; return; }
    url = '/solicitacao-auth/mobilizacao/kit?colaborador_id=' + encodeURIComponent(m.colab.id);
  }
  if (!m.inicio) { m.erro = 'Informe a data de início.'; return; }
  if (!m.arm) { m.erro = 'Escolha o armazém.'; return; }
  m.carregando = true; render();
  const r = await req(url);
  m.carregando = false;
  if (S.mob !== m) return;
  if (!r?.ok) { m.erro = r?.erro || 'Não foi possível montar o kit.'; return; }

  if (!(r.itens || []).length) { m.erro = 'Esse colaborador já tem todos os itens da dotação.'; return; }
  m.kit = r;
  m.tam = {};
  for (const it of r.itens) { const salvo = (r.tamanhos_salvos || {})[it.familia]; if (it.com_tamanho && salvo && it.tamanhos.some(t => t.tamanho === salvo)) m.tam[it.familia] = salvo; }

}
async function mobEnviar() {
  const m = S.mob;

  if (faltando.length) { m.erro = `Escolha o tamanho de: ${faltando.join(', ')}.`; return; }
  const corpo = { tipo: m.tipo, data_inicio: m.inicio, armazem_id: m.arm, tamanhos: m.tam, obs: m.obs, chave_envio: m.chave };

async function dsEnviar() {

  const corpo = { colaborador_id: d.colab.id, data_desligamento: d.data, armazem_id: d.arm, itens, chave_envio: d.chave, obs: d.obs };

  if (!r?.ok) { d.erro = r?.erro || 'Não foi possível enviar.'; return; }
  d.ok = { id: r.id, valor_desconto: Number(r.valor_desconto) || 0, pedidos_cancelados: r.pedidos_cancelados || 0, aEntregar: d.resp.filter(x => x.situacao !== 'NAO').length };

  aba: (v) => { if (v === 'acomp') S.ac.vista = 'painel'; S.aba = v; S.folha = null; carregarAvisos().then(renderDepois); if (v === 'acomp' || v === 'mob') carregarPedidos().then(renderDepois); if (v === 'desl') carregarDesls().then(renderDepois); if (v === 'pedir' && S.ped.enviado) S.ped = novoPedido(); },
  conta: () => { S.folha = { tipo: 'conta' }; S.bioAparelhos = null; carregarAparelhosBio(); },
  tema: (v) => { S.tema = v || null; try { if (S.tema) localStorage.setItem('gca_portal_tema', S.tema); else localStorage.removeItem('gca_portal_tema'); } catch {} aplicarTema(); },
  trocarFilial: () => { const mat = S.usr.matricula; S.token = null; S.usr = null; S.dados = null; S.folha = null; S.login = { passo: 'cred', filiais: [], mat, erro: '', aviso: 'Entre de novo e escolha a filial.' }; },
  sair: () => { const mat = S.usr?.matricula || ''; S.token = null; S.usr = null; S.dados = null; S.folha = null; S.pedidos = []; S.pedidosCarregados = false; S.ac = novoAc(); S.podeMob = S.podeDesl = false; S.mob = S.desl = S.desls = null; S.login = { passo: 'cred', filiais: [], mat, erro: '', aviso: '' }; },
  fecharFolha: () => { S.folha = null; },
  fecharFolhaFundo: (v, el, ev) => { if (ev.target === el) S.folha = null; else return false; },
  para: (v) => { if (S.ped.para === v) return; trocarDestino(() => { Object.assign(S.ped, { para: v, busca: '', viatura: null, retira: null, colab: null, dot: null, confirmar: null }); limparItensEFotos(S.ped); }); },
  escolherColab: (v) => {
    const p = S.ped;
    if (p.colab && p.colab !== v && (p.carrinho.length || p.fotos.length || p.guardados.length)) { p.confirmar = () => { limparItensEFotos(p); irParaItens(v); }; return; }
    if (p.colab !== v) { p.guardados = []; }
    irParaItens(v);
  },
  escolherVtr: (v) => { S.ped.viatura = v; S.ped.busca = ''; S.ped.buscaRet = ''; },
  trocarVtr: () => { trocarDestino(() => { Object.assign(S.ped, { viatura: null, retira: null, confirmar: null }); limparItensEFotos(S.ped); }); },
  escolherRetira: (v) => { Object.assign(S.ped, { retira: v, passo: 2, aberto: null, form: null, dot: null }); },
  confirmaTroca: () => { const f = S.ped.confirmar; S.ped.confirmar = null; f(); },
  cancelaTroca: () => { S.ped.confirmar = null; },
  voltarP1: () => { S.ped.passo = 1; S.ped.aberto = null; S.ped.form = null; },
  voltarP2: () => { S.ped.passo = 2; S.ped.erro = ''; },
  recarregarDot: () => { carregarDotacao(S.ped); return false; },
  arm: (v) => trocarArmazem(v),
  soTem: () => { S.ped.soTem = !S.ped.soTem; },
  abrirItem: (v) => abrirItem(v),
  abrirItemRev: (v) => { S.ped.passo = 2; abrirItem(v); setTimeout(() => document.querySelector('.item.aberto')?.scrollIntoView({ block: 'center' }), 40); },
  fecharItem: () => { S.ped.aberto = null; S.ped.form = null; },
  tam: (v) => {
    const p = S.ped, f = p.form; if (!f) return;
    f.itemId = v; f.erro = ''; if (f.trocaTam === v) f.trocaTam = '';
    const r = regras(); f.qtd = Math.min(f.qtd, Math.max(1, r.max));
    checarTroca(); checarDur();
  },
  qtd: (v) => { const f = S.ped.form; if (!f) return; f.qtd = Math.max(1, f.qtd + Number(v)); f.erro = ''; },
  porNoPedido: () => porNoPedido(false),
  guardar: () => porNoPedido(true),
  tirarDoPedido: (v) => { const p = S.ped; p.carrinho = p.carrinho.filter(x => x.grupo !== v); p.aberto = null; p.form = null; if (!p.carrinho.length && p.passo === 3) p.passo = 2; },
  tirarGuardado: (v) => { S.ped.guardados = S.ped.guardados.filter(x => x.grupo !== v); },
  irRevisar: () => { const p = S.ped; if (p.carrinho.length) { p.passo = 3; p.aberto = null; p.form = null; p.erro = ''; } },
  prio: (v) => { if (S.ped.travaPrio) return; S.ped.prioridade = v; S.ped.erro = ''; },
  tirarFoto: (v) => { S.ped.fotos.splice(Number(v), 1); },
  tirarBo: (v) => { const x = S.ped.carrinho[Number(v)]; if (x) x.bo = null; },
  enviarPedido: () => enviarPedido(),
  pedirFaltou: (v) => {
    const p = S.ped, daqui = p.guardados.filter(x => x.arm === v), resto = p.guardados.filter(x => x.arm !== v);
    S.ped = novoPedido({ para: p.para, colab: p.colab, colabNome: p.colabNome, viatura: p.viatura, retira: p.retira, passo: 2, arm: v, dot: p.dot, assPend: p.assPend,
      carrinho: daqui.map(({ arm, ...x }) => ({ ...x, orig: null })), guardados: resto });
    toast(`Pedido do ${armCap(v)} já montado. Confira e envie.`);
  },
  novoPedido: () => { S.ped = novoPedido(); },
  acAbrir: (v) => { S.ac.vista = 'lista'; S.ac.grupo = v; S.ac.lista = null; return carregarListaAc(); },
  acGrupo: (v) => { if (S.ac.grupo === v) return false; S.ac.grupo = v; S.ac.lista = null; return carregarListaAc(); },
  acPainel: () => { S.ac.vista = 'painel'; return carregarResumoAc(); },
  acMais: () => carregarListaAc(true),
  acLimparBusca: () => { S.ac.busca = ''; clearTimeout(_tmAcBusca); setTimeout(() => document.getElementById('acBusca')?.focus(), 0); return acRecarregar(); },
  verImagem: (v) => { S.folha = { tipo: 'imagem', id: v }; },
  lerAviso: (v) => { S.folha = { tipo: 'aviso', id: v }; },
  atualizarPedidos: () => carregarPedidos(),
  verPedido: (v) => { S.folha = { tipo: 'pedido', id: v }; },
  cancelarPedido: () => { S.folha.confirmaCancelar = true; S.folha.erro = ''; },
  naoCancelar: () => { S.folha.confirmaCancelar = false; },
  simCancelar: async () => {
    const f = S.folha; if (!f || f.cancelando) return;
    f.cancelando = true; render();
    const r = await req('/solicitacao-auth/cancelar/' + encodeURIComponent(f.id), { method: 'POST', body: {} });
    f.cancelando = false;
    if (!r.ok) { f.erro = r.erro || 'Não foi possível cancelar.'; f.confirmaCancelar = false; return; }
    S.folha = null; toast('Pedido cancelado.');
    await Promise.all([carregarPedidos(), carregarReservas()]);
  },
  editarPedido: () => { const s = pedidoPorId(S.folha?.id); if (s) editarPedido(s); },
  ciente: (v) => confirmarCiencia(v),
  fecharAviso: (v) => { if (!_avisosFechados.includes(v)) _avisosFechados.push(v); try { localStorage.setItem('gca_portal_avisos_fechados', JSON.stringify(_avisosFechados.slice(-100))); } catch {} },
  instalarApp: () => instalarApp(),
  verGuiaIOS: () => { S.folha = { tipo: 'instalarIOS' }; },
  instalarFechar: () => { _instalarFechado = true; try { localStorage.setItem('gca_portal_instalar_fechado', '1'); } catch {} },
  // mobilização
  mobNovo: () => { S.mob = novaMob(); },
  mobVoltar: () => { S.mob = null; },
  mobP1: () => { S.mob.passo = 1; S.mob.erro = ''; },
  mobTipo: (v) => { const m = S.mob; if (m.tipo === v) return; m.tipo = v; m.erro = ''; if (v === 'NOVATO') { m.colab = null; m.colabAviso = ''; } },
  mobColab: (v) => { const c = I.colab.get(v); if (c) Object.assign(S.mob, { colab: c, busca: '', colabAviso: '', erro: '' }); },
  mobTrocarColab: () => { Object.assign(S.mob, { colab: null, colabAviso: '' }); },
  mobTam: (v) => { const m = S.mob, i = Number(v.split('|')[0]), t = v.slice(v.indexOf('|') + 1); const it = m.kit?.itens[i]; if (it) { m.tam[it.familia] = t; m.erro = ''; } },
  mobVerKit: () => mobVerKit(),
  mobEnviar: () => mobEnviar(),
  // desligamento
  dsNovo: () => { S.desl = novoDesl(); },
  dsVoltar: () => { const d = S.desl; if (d && d.mat) { d.confirmarSair = true; return; } S.desl = null; carregarDesls().then(renderDepois); },
  dsSairSim: () => { S.desl = null; carregarDesls().then(renderDepois); },
  dsSairNao: () => { S.desl.confirmarSair = false; },
  dsVoltarLista: () => { S.desl = null; carregarDesls().then(renderDepois); },
  dsColab: (v) => { const c = (S.deslOp?.colaboradores || []).find(x => x.id === v); if (c) Object.assign(S.desl, { colab: c, busca: '', erro: '', mat: null, resp: [] }); },
  dsTrocar: () => { Object.assign(S.desl, { colab: null, mat: null, resp: [], confirmarSair: false }); },
  dsP1: () => { S.desl.passo = 1; S.desl.erro = ''; },
  dsP2: () => { S.desl.passo = 2; S.desl.erro = ''; },
  dsVerMaterial: () => dsVerMaterial(),
  dsSit: (v) => {
    const [i, s] = v.split('|'); const r = S.desl.resp[Number(i)]; if (!r) return;
    r.situacao = s; S.desl.erro = '';
    if (s === 'NAO') { r.fotos = []; r.estado = ''; r.qtd_devolvida = ''; }
    if (s === 'SIM') { r.motivo = ''; r.motivo_texto = ''; r.isentar = false; r.justificativa = ''; r.qtd_devolvida = ''; }
  },
  dsTirarFoto: (v) => { const [i, j] = v.split('|').map(Number); S.desl.resp[i]?.fotos.splice(j, 1); },
  dsResumo: () => { const d = S.desl, e = dsValidar(); if (e) { d.erro = e; return; } d.erro = ''; d.passo = 3; },
  dsLimpar: () => { S.desl.assImg = null; S.desl.assTracos = 0; },
  dsEnviar: () => dsEnviar(),
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = acoes[el.dataset.a];
  if (!fn) return;
  const r = fn(el.dataset.v, el, ev);
  if (r === false) return;
  render();
  if (r && typeof r.then === 'function') r.then(() => render(), () => render());
});
document.addEventListener('submit', (ev) => {
  if (ev.target.dataset.f !== 'login') return;
  ev.preventDefault();
  const mat = document.getElementById('lgMat').value.trim(), sen = document.getElementById('lgSen').value.trim();
  S.login.mat = mat; S.login.aviso = '';
  if (!mat || !sen) { erroLogin('Preencha matrícula e senha.'); return; }
  _cred = { mat, sen };
  entrar();
});
// Campos de texto: mudam o estado sem redesenhar a tela inteira (o teclado não fecha)
// Esc fecha a folha aberta (detalhe do pedido, imagem do aviso...)
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.folha) { S.folha = null; render(); } });
document.addEventListener('input', (ev) => {
  const el = ev.target, k = el.dataset.i;
  if (k === 'acBusca') { acBuscaDigitada(el.value); return; }
  if (!k || !S.ped) return;
  const p = S.ped, v = el.value;
  if (k === 'buscaPessoa') { p.busca = v; document.getElementById('blocoLista').innerHTML = listaParaQuem(); return; }
  if (k === 'buscaRet') { p.buscaRet = v; const l = document.getElementById('listaRet'); if (l) l.innerHTML = listaRetirantes(); return; }
  if (k === 'buscaItem') { p.buscaItem = v; const l = document.getElementById('listaItens'); if (l) l.innerHTML = htmlListaItens(itensVisiveis()); return; }
  if (k === 'just' && p.form) { p.form.just = v; return; }
  if (k === 'justDur' && p.form) { p.form.justDur = v; return; }
  if (k === 'obs') { p.obs = v; return; }
  if (k === 'boNum') { p.boNum[el.dataset.k] = v; return; }
  const m = S.mob, d = S.desl;
  if (m) {
    if (k === 'mobMat') { m.mat = v; m.matConf = null; m.matMsg = null; atualizarMsgMatricula(); clearTimeout(_mobMatTimer); _mobMatTimer = setTimeout(conferirMatricula, 700); return; }
    if (k === 'mobNome') { m.nome = v; return; }
    if (k === 'mobTel') { m.tel = v; return; }
    if (k === 'mobObs') { m.obs = v; return; }
    if (k === 'mobBusca') { m.busca = v; const l = document.getElementById('mbLista'); if (l) l.innerHTML = listaMobColab(); return; }
  }
  if (d) {
    if (k === 'dsBusca') { d.busca = v; const l = document.getElementById('dsLista'); if (l) l.innerHTML = listaDeslColab(); return; }
    if (k === 'dsJustA') { d.justA = v; return; }
    if (k === 'dsObs') { d.obs = v; return; }
    if (k === 'dsTest') { d.test = v; d.testNome = ''; d.testErro = ''; atualizarDicaTest(); clearTimeout(_testTimer); _testTimer = setTimeout(conferirTestemunha, 600); return; }
    const i = Number(el.dataset.k), r = d.resp?.[i], mt = d.mat?.itens?.[i];
    if (r && (k === 'dsDev' || k === 'dsJust' || k === 'dsMotTxt')) {
      if (k === 'dsDev') r.qtd_devolvida = v; else if (k === 'dsJust') r.justificativa = v; else r.motivo_texto = v;
      const box = el.closest('.item')?.querySelector('.ds-valor');
      if (box && !r.isentar && Number(mt.valor_un) > 0) box.innerHTML = `Desconto: <b>${brl(dsValor(mt, r).valor)}</b>`;
      el.closest('.item')?.classList.toggle('pronto', dsPronto(mt, r));
      atualizarTotalDesl(); return;
    }
  }
});
document.addEventListener('change', async (ev) => {
  const el = ev.target, k = el.dataset.i;
  if (!k || !S.ped) return;
  const p = S.ped;
  if (k === 'motivo' && p.form) { p.form.motivo = el.value; p.form.erro = ''; aplicarTrocaDetectada(); render(); checarDur(); return; }
  if (k === 'trocaTam' && p.form) { p.form.trocaTam = el.value; return; }
  if (k === 'parcelas') { p.parcelas = el.value; p.erro = ''; return; }
  const m = S.mob, d = S.desl;
  if (m && k === 'mobFun') { m.funcao = el.value; return; }
  if (m && k === 'mobSet') { m.setor = el.value; return; }
  if (m && k === 'mobIni') { m.inicio = el.value; return; }
  if (m && k === 'mobArm') { m.arm = el.value; return; }
  if (m && k === 'mobMat') { clearTimeout(_mobMatTimer); conferirMatricula(); return; }
  if (d) {
    if (k === 'dsData') { d.data = el.value; return; }
    if (k === 'dsArm') { d.arm = el.value; return; }
    if (k === 'dsSemAss') { d.semAss = el.checked; d.erro = ''; render(); return; }
    const i = Number(el.dataset.k), r = d.resp?.[i];
    if (r && k === 'dsEst') { r.estado = el.value; d.erro = ''; render(); return; }
    if (r && k === 'dsMot') { r.motivo = el.value; d.erro = ''; render(); return; }
    if (r && k === 'dsIsentar') { r.isentar = el.checked; d.erro = ''; render(); return; }
    if (r && k === 'dsSerial') { const s = el.dataset.s; r.seriais = el.checked ? [...new Set([...r.seriais, s])] : r.seriais.filter(x => x !== s); return; }
    if (r && k === 'dsFoto' && el.files?.[0]) { const arq = el.files[0]; el.value = ''; dsFoto(i, arq); return; }
  }
  if (k === 'boArq' && el.files?.[0]) { const arq = el.files[0]; el.value = ''; anexarBo(Number(el.dataset.k), arq); return; }
  if (k === 'fotoPedido' && el.files?.[0]) {
    const arq = el.files[0]; el.value = '';
    if (p.fotos.length + p.fotosLendo >= 3) { toast('No máximo 3 fotos.'); return; }
    p.fotosLendo++; render();
    try {
      const dataUrl = await lerFoto(arq);
      const bytes = Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 3 / 4);
      if (bytes > 5 * 1024 * 1024) toast('A foto passa de 5 MB.');
      else { p.fotos.push({ dataUrl, nome: String(arq.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg' }); p.erro = ''; }
    } catch { toast('Não foi possível ler a foto.'); }
    p.fotosLendo--; render();
  }
});
// Acompanhar atualiza sozinho a cada minuto (só com a tela aberta e sem nenhuma janela por cima)
setInterval(() => { if (S.token && document.visibilityState === 'visible' && !S.folha) carregarAvisos().then(renderDepois); }, 60000);
setInterval(async () => {
  if (!S.token || S.aba !== 'acomp' || S.folha || document.visibilityState !== 'visible') return;
  await carregarPedidos();
  if (S.aba === 'acomp' && !S.folha) renderDepois();
}, 60000);

S.ped = novoPedido();
render();
carregarAvisosEntrada();
verBioDisponivel();
// Service worker sem cache, só com a página "Sem internet" (sw-portal.js). O escopo fica nas páginas /solicitacao*.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw-portal.js', { scope: './solicitacao' }).catch(() => {}); });
}
// Para os testes de tela (só no arquivo de teste)
if (EM_TESTE) window.__portal = { S, I, trocaCache };
})();
</script>
