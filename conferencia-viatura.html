<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GCA — Conferência da Viatura</title>
<link rel="icon" type="image/png" href="./icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#6366f1;--accent-hover:#4f46e5;--accent-text:#818cf8;
  --green:#22c55e;--green-soft:#052e16;--yellow:#fbbf24;--yellow-soft:#1c1300;
  --red:#f87171;--red-soft:#1c0a0a;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --font-main:'DM Sans',-apple-system,sans-serif;--font-mono:'DM Mono',monospace;
  --bg:#0a0a0f;--bg-card:#0f0f17;--bg-hover:#0f172a;
  --border:#1e1e2e;--border-mid:#2a2a3e;
  --text-1:#f1f5f9;--text-2:#94a3b8;--text-3:#475569;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font-main);cursor:pointer;}
input{font-family:var(--font-main);}
.hidden{display:none!important;}

.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;}
.titulo{font-size:16px;font-weight:700;text-align:center;margin-bottom:2px;}
.sub{font-size:12px;color:var(--text-3);text-align:center;margin-bottom:22px;}
.placa-badge{display:block;text-align:center;font-size:26px;font-weight:700;font-family:var(--font-mono);letter-spacing:3px;background:var(--bg);border:2px solid var(--border-mid);border-radius:10px;padding:10px;margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-group{margin-bottom:14px;}
.form-input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-size:14px;outline:none;}
.form-input:focus{border-color:var(--accent);}
.btn{padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:none;cursor:pointer;width:100%;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.erro-box{margin-top:12px;padding:10px 12px;background:var(--red-soft);border:1px solid rgba(248,113,113,.25);border-radius:var(--radius-sm);color:var(--red);font-size:12px;text-align:center;}

.app{display:none;flex-direction:column;min-height:100vh;}
.app.ativo{display:flex;}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:10;}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.header-titulo{font-size:14px;font-weight:700;font-family:var(--font-mono);letter-spacing:1px;}
.header-sub{font-size:11px;color:var(--text-3);}
.header-nome{font-size:11px;color:var(--accent-text);}
.progresso-bar{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden;}
.progresso-fill{height:100%;background:var(--green);transition:width .3s ease;}
.progresso-txt{font-size:10px;color:var(--text-3);margin-top:4px;}

.lista{flex:1;overflow-y:auto;padding:10px 12px 90px;}
.item-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.item-card.contado{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.04);}
.item-card.divergente{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.04);}
.item-nome{font-size:13px;font-weight:600;}
.item-cod{font-size:10px;color:var(--text-3);font-family:var(--font-mono);}
.item-status{font-size:10px;color:var(--text-3);margin-top:2px;}
.item-status.ok{color:var(--green);font-weight:600;}
.item-status.dif{color:var(--yellow);font-weight:600;}
.item-btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;border:none;background:var(--accent);color:#fff;white-space:nowrap;}

.footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;}
.footer .btn{width:auto;flex:1;}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:12px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-overlay.hidden{display:none;}
.modal-box{width:100%;max-width:420px;background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:24px;border:1px solid var(--border);border-bottom:none;max-height:92vh;overflow-y:auto;}
.modal-item-nome{font-size:14px;font-weight:700;margin-bottom:4px;}
.modal-item-cod{font-size:11px;color:var(--text-3);margin-bottom:18px;}
.qtd-input{width:100%;padding:14px;font-size:22px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);margin-bottom:14px;}
.serial-tag{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12px;margin-bottom:6px;}
.serial-tag.fora{border-color:rgba(251,191,36,.4);color:var(--yellow);}
.serial-x{background:none;border:none;color:var(--red);font-size:14px;}

.tela-final{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
.tela-final.ativo{display:flex;}
.resumo-linha{display:flex;justify-content:space-between;gap:10px;width:100%;max-width:420px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="telaLogin">
  <div class="card">
    <div class="titulo">🚚 Conferência da Viatura</div>
    <div class="sub" id="loginSub">Carregando...</div>
    <div class="placa-badge" id="loginPlaca">—</div>
    <div class="form-group">
      <label class="form-label">Matrícula</label>
      <input class="form-input" id="loginMatricula" placeholder="Sua matrícula" autocomplete="off" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" id="loginSenha" type="password" placeholder="Sua senha" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="fazerLogin()">Entrar</button>
    <div id="loginErro" class="erro-box hidden"></div>
  </div>
</div>

<!-- CONFERÊNCIA -->
<div class="app" id="telaApp">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-titulo" id="appPlaca">—</div>
        <div class="header-sub" id="appSub">Confira o que está na viatura</div>
      </div>
      <div class="header-nome" id="appNome">—</div>
    </div>
    <div class="progresso-bar"><div class="progresso-fill" id="progressoFill" style="width:0%"></div></div>
    <div class="progresso-txt" id="progressoTxt">0 de 0 conferidos</div>
  </div>
  <div class="lista" id="listaItens"></div>
  <div class="footer">
    <button class="btn btn-ghost" onclick="carregarItens()">↻ Atualizar</button>
    <button class="btn btn-primary" onclick="finalizar()">✅ Finalizar conferência</button>
  </div>
</div>

<!-- TELA FINAL -->
<div class="tela-final" id="telaFinal">
  <div style="font-size:48px;margin-bottom:12px" id="finalIcone">✅</div>
  <div style="font-size:18px;font-weight:700;margin-bottom:8px" id="finalTitulo">Conferência finalizada!</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:16px" id="finalResumo">—</div>
  <div id="finalDivergencias" style="width:100%;max-width:420px;margin-bottom:18px"></div>
  <div style="font-size:11px;color:var(--text-3)">O almoxarifado vai resolver as diferenças. Pode fechar esta página.</div>
</div>

<!-- MODAL CONTAR -->
<div class="modal-overlay hidden" id="modalContar">
  <div class="modal-box">
    <div class="modal-item-nome" id="modalItemNome">—</div>
    <div class="modal-item-cod" id="modalItemCod">—</div>

    <div id="modalQtdArea">
      <label class="form-label">Quantidade encontrada na viatura</label>
      <input class="qtd-input" id="qtdInput" type="number" min="0" inputmode="decimal" placeholder="0">
    </div>

    <div id="modalSerialArea" class="hidden">
      <label class="form-label">Leia ou digite o serial de cada peça</label>
      <input class="form-input" id="serialInput" placeholder="Serial + Enter" autocomplete="off" style="margin-bottom:10px">
      <div id="serialLista"></div>
      <div style="font-size:11px;color:var(--text-3);margin:6px 0 14px" id="serialResumo">Nenhum serial lido</div>
    </div>

    <div id="modalErro" class="erro-box hidden"></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="confirmarContagem()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API = 'https://gca-backend-production.up.railway.app';

const par = (nome) => new URLSearchParams(location.search).get(nome) || '';
const PLACA = par('placa').toUpperCase();
const UNIDADE = par('unidade');
const CHAVE = 'conf_vtr_' + UNIDADE + '_' + PLACA;
let TOKEN_SESSAO = sessionStorage.getItem(CHAVE) || '';
let NOME_SESSAO = sessionStorage.getItem(CHAVE + '_nome') || '';
let _itens = [];
let _itemAtual = null;
let _seriaisLidos = [];

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(path, opts = {}) {
  try {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(TOKEN_SESSAO ? { Authorization: 'Bearer ' + TOKEN_SESSAO } : {}), ...(opts.headers || {}) },
    });
    return await res.json().catch(() => ({ ok: false, erro: 'Erro de resposta' }));
  } catch (err) {
    return { ok: false, erro: 'Erro de conexão: ' + err.message };
  }
}

async function iniciar() {
  const sub = document.getElementById('loginSub');
  if (!PLACA || !UNIDADE) {
    sub.textContent = 'QR inválido — peça ajuda ao almoxarifado.';
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  document.getElementById('loginPlaca').textContent = PLACA;
  document.title = 'GCA — Conferência ' + PLACA;
  const info = await fetch(`${API}/conferencia-viatura/info?placa=${encodeURIComponent(PLACA)}&unidade=${encodeURIComponent(UNIDADE)}`)
    .then(r => r.json()).catch(() => null);
  if (!info?.ok) {
    sub.textContent = info?.erro || 'Não foi possível abrir esta viatura.';
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  sub.textContent = [info.modelo, info.tipo, info.base].filter(Boolean).join(' · ') || 'Entre com seu crachá para conferir';
  if (TOKEN_SESSAO) { abrirApp(); }
}

async function fazerLogin() {
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('loginBtn');
  const matricula = document.getElementById('loginMatricula').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if (!matricula || !senha) { erro.textContent = 'Preencha matrícula e senha'; erro.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; erro.classList.add('hidden');
  const res = await fetch(`${API}/conferencia-viatura/login`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ placa: PLACA, unidade: UNIDADE, matricula, senha }),
  }).then(r => r.json()).catch(() => ({ ok: false, erro: 'Erro de conexão' }));
  btn.disabled = false; btn.textContent = 'Entrar';
  if (!res.ok) { erro.textContent = res.erro || 'Não foi possível entrar'; erro.classList.remove('hidden'); return; }
  TOKEN_SESSAO = res.token; NOME_SESSAO = res.nome || '';
  sessionStorage.setItem(CHAVE, TOKEN_SESSAO);
  sessionStorage.setItem(CHAVE + '_nome', NOME_SESSAO);
  abrirApp();
}

async function abrirApp() {
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('telaApp').classList.add('ativo');
  document.getElementById('appPlaca').textContent = PLACA;
  document.getElementById('appNome').textContent = NOME_SESSAO;
  const ini = await api('/conferencia-viatura/iniciar', { method: 'POST' });
  if (!ini.ok) { sairSessao(ini.erro); return; }
  await carregarItens();
}

function sairSessao(msg) {
  sessionStorage.removeItem(CHAVE);
  TOKEN_SESSAO = '';
  document.getElementById('telaApp').classList.remove('ativo');
  document.getElementById('telaLogin').style.display = 'flex';
  const erro = document.getElementById('loginErro');
  erro.textContent = msg || 'Faça login novamente';
  erro.classList.remove('hidden');
}

async function carregarItens() {
  const lista = document.getElementById('listaItens');
  lista.innerHTML = '<div class="empty">Carregando...</div>';
  const res = await api('/conferencia-viatura/itens');
  if (!res.ok) { sairSessao(res.erro); return; }
  _itens = res.itens || [];
  render();
}

function render() {
  const lista = document.getElementById('listaItens');
  if (!_itens.length) {
    lista.innerHTML = '<div class="empty">Esta viatura está sem material na carga.</div>';
    document.getElementById('progressoTxt').textContent = '0 de 0 conferidos';
    return;
  }
  const contados = _itens.filter(i => i.contado !== null).length;
  document.getElementById('progressoFill').style.width = Math.round((contados / _itens.length) * 100) + '%';
  document.getElementById('progressoTxt').textContent = `${contados} de ${_itens.length} conferidos`;

  lista.innerHTML = _itens.map(i => {
    const feito = i.contado !== null;
    const dif = feito ? Number(i.contado) - Number(i.esperado) : 0;
    const classe = !feito ? '' : (dif === 0 && i.status === 'OK' ? 'contado' : 'divergente');
    const situacao = !feito
      ? `<div class="item-status">Previsto: ${i.esperado}${(i.seriais_esperados || []).length ? ` · ${i.seriais_esperados.length} serial(is)` : ''}</div>`
      : (i.status === 'OK'
        ? `<div class="item-status ok">✓ Conferido: ${i.contado}</div>`
        : `<div class="item-status dif">⚠ Previsto ${i.esperado} · encontrado ${i.contado}</div>`);
    return `<div class="item-card ${classe}">
      <div style="flex:1">
        <div class="item-nome">${escHtml(i.item_descricao || i.item_id)}</div>
        <div class="item-cod">${escHtml(i.codigo_item || '—')} ${escHtml(i.un_med || '')}</div>
        ${situacao}
      </div>
      <button class="item-btn" onclick="abrirModal('${escHtml(i.item_id)}')">${feito ? 'Refazer' : 'Conferir'}</button>
    </div>`;
  }).join('');
}

function abrirModal(itemId) {
  _itemAtual = _itens.find(i => i.item_id === itemId);
  if (!_itemAtual) return;
  _seriaisLidos = [..._itemAtual.seriais_encontrados || []];
  document.getElementById('modalItemNome').textContent = _itemAtual.item_descricao || _itemAtual.item_id;
  document.getElementById('modalItemCod').textContent = `${_itemAtual.codigo_item || '—'} · previsto ${_itemAtual.esperado}`;
  document.getElementById('modalErro').classList.add('hidden');

  const temSerial = (_itemAtual.seriais_esperados || []).length > 0;
  document.getElementById('modalQtdArea').classList.toggle('hidden', temSerial);
  document.getElementById('modalSerialArea').classList.toggle('hidden', !temSerial);
  if (temSerial) {
    document.getElementById('serialInput').value = '';
    renderSeriais();
    setTimeout(() => document.getElementById('serialInput').focus(), 100);
  } else {
    const campo = document.getElementById('qtdInput');
    campo.value = _itemAtual.contado !== null ? _itemAtual.contado : '';
    setTimeout(() => campo.focus(), 100);
  }
  document.getElementById('modalContar').classList.remove('hidden');
}

function fecharModal() {
  document.getElementById('modalContar').classList.add('hidden');
  _itemAtual = null;
}

function lerSerial(valor) {
  const serial = String(valor || '').trim().toUpperCase();
  if (!serial) return;
  if (_seriaisLidos.includes(serial)) {
    mostrarErroModal('Este serial já foi lido.');
    return;
  }
  _seriaisLidos.push(serial);
  document.getElementById('serialInput').value = '';
  document.getElementById('modalErro').classList.add('hidden');
  renderSeriais();
}

function tirarSerial(serial) {
  _seriaisLidos = _seriaisLidos.filter(s => s !== serial);
  renderSeriais();
}

function renderSeriais() {
  const esperados = _itemAtual?.seriais_esperados || [];
  document.getElementById('serialLista').innerHTML = _seriaisLidos.map(s => `
    <div class="serial-tag ${esperados.includes(s) ? '' : 'fora'}">
      <span>${escHtml(s)}${esperados.includes(s) ? '' : ' · não é desta viatura'}</span>
      <button class="serial-x" onclick="tirarSerial('${escHtml(s)}')">✕</button>
    </div>`).join('');
  const faltando = esperados.filter(s => !_seriaisLidos.includes(s));
  document.getElementById('serialResumo').innerHTML = _seriaisLidos.length
    ? `${_seriaisLidos.length} de ${esperados.length} lido(s)${faltando.length ? ` · falta: ${escHtml(faltando.join(', '))}` : ' · tudo conferido'}`
    : `Nenhum serial lido — previsto ${esperados.length}`;
}

function mostrarErroModal(msg) {
  const e = document.getElementById('modalErro');
  e.textContent = msg;
  e.classList.remove('hidden');
}

async function confirmarContagem() {
  if (!_itemAtual) return;
  const temSerial = (_itemAtual.seriais_esperados || []).length > 0;
  const corpo = { item_id: _itemAtual.item_id };
  if (temSerial) {
    corpo.seriais = _seriaisLidos;
    corpo.contado = _seriaisLidos.length;
  } else {
    const qtd = Number(document.getElementById('qtdInput').value);
    if (!Number.isFinite(qtd) || qtd < 0) { mostrarErroModal('Informe a quantidade encontrada (zero ou mais).'); return; }
    corpo.contado = qtd;
  }
  const res = await api('/conferencia-viatura/contar', { method: 'POST', body: JSON.stringify(corpo) });
  if (!res.ok) { mostrarErroModal(res.erro || 'Erro ao gravar'); return; }
  fecharModal();
  await carregarItens();
}

async function finalizar() {
  const faltam = _itens.filter(i => i.contado === null);
  if (faltam.length && !confirm(`Ainda faltam ${faltam.length} material(is) para conferir. Finalizar assim mesmo não é possível — quer voltar e conferir?`)) return;
  const res = await api('/conferencia-viatura/finalizar', { method: 'POST' });
  if (!res.ok) { alert(res.erro || 'Erro ao finalizar'); return; }
  document.getElementById('telaApp').classList.remove('ativo');
  document.getElementById('telaFinal').classList.add('ativo');
  const temDif = res.divergentes > 0;
  document.getElementById('finalIcone').textContent = temDif ? '⚠️' : '✅';
  document.getElementById('finalTitulo').textContent = temDif ? 'Conferência com diferenças' : 'Tudo certo na viatura!';
  document.getElementById('finalResumo').textContent = temDif
    ? `${res.divergentes} de ${res.total} material(is) com diferença`
    : `${res.total} material(is) conferidos, tudo batendo`;
  document.getElementById('finalDivergencias').innerHTML = (res.resumo || []).map(d => `
    <div class="resumo-linha">
      <span>${escHtml(d.item)}</span>
      <span style="color:${d.diferenca < 0 ? 'var(--red)' : 'var(--yellow)'}">${d.diferenca > 0 ? '+' : ''}${d.diferenca} (previsto ${d.esperado}, achou ${d.contado})</span>
    </div>`).join('');
}

document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
document.getElementById('serialInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); lerSerial(e.target.value); }
});
iniciar();
</script>
</body>
</html>
