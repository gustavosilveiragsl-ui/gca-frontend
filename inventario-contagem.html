<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GCA — Contagem de Inventário</title>
<link rel="icon" type="image/png" href="./icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#6366f1;--accent-hover:#4f46e5;--accent-text:#818cf8;
  --green:#22c55e;--green-soft:#052e16;--yellow:#fbbf24;--yellow-soft:#1c1300;
  --red:#f87171;--red-soft:#1c0a0a;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --font-main:'DM Sans',-apple-system,sans-serif;--font-mono:'DM Mono',monospace;
  --transition:0.15s ease;
  --bg:#0a0a0f;--bg-card:#0f0f17;--bg-hover:#0f172a;
  --border:#1e1e2e;--border-mid:#2a2a3e;
  --text-1:#f1f5f9;--text-2:#94a3b8;--text-3:#475569;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font-main);cursor:pointer;}
input{font-family:var(--font-main);}
.hidden{display:none!important;}

.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;}
.titulo{font-size:16px;font-weight:700;text-align:center;margin-bottom:2px;}
.sub{font-size:12px;color:var(--text-3);text-align:center;margin-bottom:22px;}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-group{margin-bottom:14px;}
.form-input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-size:14px;outline:none;}
.form-input:focus{border-color:var(--accent);}
.btn{padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:none;cursor:pointer;width:100%;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.erro-box{margin-top:12px;padding:10px 12px;background:var(--red-soft);border:1px solid rgba(248,113,113,.25);border-radius:var(--radius-sm);color:var(--red);font-size:12px;text-align:center;}

/* ── TELA DE CONTAGEM ── */
.app{display:none;flex-direction:column;min-height:100vh;}
.app.ativo{display:flex;}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:10;}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.header-titulo{font-size:14px;font-weight:700;}
.header-sub{font-size:11px;color:var(--text-3);}
.header-nome{font-size:11px;color:var(--accent-text);}
.progresso-bar{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden;}
.progresso-fill{height:100%;background:var(--green);transition:width .3s ease;}
.progresso-txt{font-size:10px;color:var(--text-3);margin-top:4px;}

.busca-box{padding:10px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);}
.busca-input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-size:13px;}

.lista{flex:1;overflow-y:auto;padding:10px 12px 90px;}
.item-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.item-card.contado{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.04);}
.item-nome{font-size:13px;font-weight:600;flex:1;}
.item-cod{font-size:10px;color:var(--text-3);font-family:var(--font-mono);}
.item-status{font-size:10px;color:var(--text-3);margin-top:2px;}
.item-status.contado{color:var(--green);font-weight:600;}
.item-btn{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;border:none;background:var(--accent);color:#fff;white-space:nowrap;}
.item-btn:disabled{background:transparent;border:1px solid var(--border);color:var(--text-3);cursor:default;}

.footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;}
.footer .btn{width:auto;flex:1;}

.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:12px;}

/* ── MODAL CONTAR ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-overlay.hidden{display:none;}
.modal-box{width:100%;max-width:420px;background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:24px;border:1px solid var(--border);border-bottom:none;}
.modal-item-nome{font-size:14px;font-weight:700;margin-bottom:4px;}
.modal-item-cod{font-size:11px;color:var(--text-3);margin-bottom:18px;}
.qtd-input{width:100%;padding:14px;font-size:22px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);margin-bottom:14px;}

.tela-final{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
.tela-final.ativo{display:flex;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="telaLogin">
  <div class="card">
    <div class="titulo">📋 Contagem de Inventário</div>
    <div class="sub" id="loginSub">Carregando...</div>
    <div class="form-group">
      <label class="form-label">Matrícula</label>
      <input class="form-input" id="loginMatricula" placeholder="Sua matrícula" autocomplete="off" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" id="loginSenha" type="password" placeholder="Sua senha" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="fazerLogin()">Entrar</button>
    <div id="loginErro" class="erro-box hidden"></div>
  </div>
</div>

<!-- APP DE CONTAGEM -->
<div class="app" id="telaApp">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-titulo" id="appTitulo">—</div>
        <div class="header-sub" id="appSub">—</div>
      </div>
      <div class="header-nome" id="appNome">—</div>
    </div>
    <div class="progresso-bar"><div class="progresso-fill" id="progressoFill" style="width:0%"></div></div>
    <div class="progresso-txt" id="progressoTxt">0 de 0 contados</div>
  </div>
  <div class="busca-box">
    <input class="busca-input" id="buscaInput" placeholder="🔍 Buscar item ou código..." oninput="renderLista()">
  </div>
  <div class="lista" id="listaItens"></div>
  <div class="footer">
    <button class="btn btn-ghost" onclick="carregarItens()">↻ Atualizar</button>
    <button class="btn btn-primary" onclick="tentarFinalizar()">✅ Finalizar Inventário</button>
  </div>
</div>

<!-- TELA FINAL -->
<div class="tela-final" id="telaFinal">
  <div style="font-size:48px;margin-bottom:12px">✅</div>
  <div style="font-size:18px;font-weight:700;margin-bottom:8px">Inventário Finalizado!</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:20px" id="telaFinalResumo">—</div>
  <div style="font-size:11px;color:var(--text-3)">Pode fechar esta página.</div>
</div>

<!-- MODAL CONTAR ITEM -->
<div class="modal-overlay hidden" id="modalContar">
  <div class="modal-box">
    <div class="modal-item-nome" id="modalItemNome">—</div>
    <div class="modal-item-cod" id="modalItemCod">—</div>
    <label class="form-label">Quantidade encontrada fisicamente</label>
    <input class="qtd-input" id="qtdInput" type="number" min="0" inputmode="numeric" placeholder="0">
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="fecharModalContar()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1" onclick="confirmarContagem()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API = 'https://gca-backend-production.up.railway.app';

function getToken() { return new URLSearchParams(location.search).get('token') || ''; }
const TOKEN_LINK = getToken();
let TOKEN_SESSAO = sessionStorage.getItem('inv_sessao_' + TOKEN_LINK) || '';
let NOME_SESSAO = sessionStorage.getItem('inv_nome_' + TOKEN_LINK) || '';

let _itens = [];
let _itemAtual = null;
let _pollTimer = null;

async function api(path, opts = {}) {
  try {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(TOKEN_SESSAO ? { Authorization: 'Bearer ' + TOKEN_SESSAO } : {}), ...(opts.headers || {}) },
    });
    const json = await res.json().catch(() => ({ ok: false, erro: 'Erro de resposta' }));
    return json;
  } catch (err) {
    return { ok: false, erro: 'Erro de conexão: ' + err.message };
  }
}

async function iniciar() {
  if (!TOKEN_LINK) {
    document.getElementById('loginSub').textContent = 'Link inválido — peça um novo link ao administrador.';
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  const info = await fetch(`${API}/inventario/contagem/info/${TOKEN_LINK}`).then(r => r.json()).catch(() => null);
  if (!info?.ok) {
    document.getElementById('loginSub').textContent = info?.erro || 'Link inválido ou expirado.';
    document.getElementById('loginBtn').disabled = true;
    return;
  }
  document.getElementById('loginSub').textContent = `${info.nome_armazem} — ${info.ano_mes}`;

  if (TOKEN_SESSAO) {
    // Já logado nesta sessão do navegador — pula direto pra contagem
    mostrarApp(info.nome_armazem, info.ano_mes, NOME_SESSAO);
  }
}

async function fazerLogin() {
  const matricula = document.getElementById('loginMatricula').value.trim();
  const senha = document.getElementById('loginSenha').value.trim();
  const erroBox = document.getElementById('loginErro');
  erroBox.classList.add('hidden');
  if (!matricula || !senha) { erroBox.textContent = 'Preencha matrícula e senha.'; erroBox.classList.remove('hidden'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const res = await api('/inventario/contagem/login', { method: 'POST', body: JSON.stringify({ token: TOKEN_LINK, matricula, senha }) });
  btn.disabled = false; btn.textContent = 'Entrar';

  if (!res.ok) { erroBox.textContent = res.erro || 'Erro ao entrar'; erroBox.classList.remove('hidden'); return; }

  TOKEN_SESSAO = res.token; NOME_SESSAO = res.nome;
  sessionStorage.setItem('inv_sessao_' + TOKEN_LINK, TOKEN_SESSAO);
  sessionStorage.setItem('inv_nome_' + TOKEN_LINK, NOME_SESSAO);
  mostrarApp(res.nome_armazem, res.ano_mes, res.nome);
}

function mostrarApp(nomeArmazem, anoMes, nome) {
  document.getElementById('telaLogin').classList.add('hidden');
  document.getElementById('telaApp').classList.add('ativo');
  document.getElementById('appTitulo').textContent = nomeArmazem;
  document.getElementById('appSub').textContent = anoMes;
  document.getElementById('appNome').textContent = '👤 ' + nome;
  carregarItens();
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(carregarItens, 6000); // "tempo real" simples via polling — várias
  // pessoas contando ao mesmo tempo veem o progresso umas das outras a cada poucos segundos.
}

async function carregarItens() {
  const res = await api('/inventario/contagem/itens');
  if (!res.ok) {
    if (res.erro?.includes('finalizado')) { mostrarTelaFinal('Este inventário já foi finalizado por outra pessoa.'); return; }
    if (res.erro?.includes('Sessão') || res.erro?.includes('Token')) {
      sessionStorage.removeItem('inv_sessao_' + TOKEN_LINK);
      location.reload();
      return;
    }
    return;
  }
  _itens = res.itens;
  document.getElementById('progressoTxt').textContent = `${res.contados} de ${res.total} contados`;
  document.getElementById('progressoFill').style.width = res.total ? `${(res.contados / res.total) * 100}%` : '0%';
  renderLista();
}

function renderLista() {
  const q = document.getElementById('buscaInput').value.trim().toLowerCase();
  let lista = _itens;
  if (q) lista = lista.filter(i => (i.nome_item || '').toLowerCase().includes(q) || (i.codigo_item || '').toLowerCase().includes(q));

  const cont = document.getElementById('listaItens');
  if (!lista.length) { cont.innerHTML = '<div class="empty">Nenhum item encontrado</div>'; return; }

  cont.innerHTML = lista.map(it => {
    const contado = it.saldo_contado != null;
    return `<div class="item-card ${contado ? 'contado' : ''}">
      <div style="flex:1">
        <div class="item-nome">${escHtml(it.nome_item || '—')}</div>
        <div class="item-cod">${escHtml(it.codigo_item || '')} ${it.un_med ? '· ' + escHtml(it.un_med) : ''}</div>
        <div class="item-status ${contado ? 'contado' : ''}">${contado ? `✓ ${it.saldo_contado} — ${escHtml(it.nome_contador || '')}` : 'Não contado'}</div>
      </div>
      <button class="item-btn" ${contado ? 'disabled' : ''} onclick="abrirModalContar('${it.id}')">${contado ? 'Contado' : 'Contar'}</button>
    </div>`;
  }).join('');
}

function abrirModalContar(itemId) {
  _itemAtual = _itens.find(i => i.id === itemId);
  if (!_itemAtual || _itemAtual.saldo_contado != null) return;
  document.getElementById('modalItemNome').textContent = _itemAtual.nome_item || '—';
  document.getElementById('modalItemCod').textContent = (_itemAtual.codigo_item || '') + (_itemAtual.un_med ? ' · ' + _itemAtual.un_med : '');
  document.getElementById('qtdInput').value = '';
  document.getElementById('modalContar').classList.remove('hidden');
  setTimeout(() => document.getElementById('qtdInput').focus(), 100);
}

function fecharModalContar() {
  document.getElementById('modalContar').classList.add('hidden');
  _itemAtual = null;
}

async function confirmarContagem() {
  const qtd = document.getElementById('qtdInput').value;
  if (qtd === '' || Number(qtd) < 0) { alert('Informe uma quantidade válida.'); return; }
  const res = await api('/inventario/contagem/contar', { method: 'POST', body: JSON.stringify({ inventario_item_id: _itemAtual.id, quantidade: Number(qtd) }) });
  if (res.ok) { fecharModalContar(); carregarItens(); }
  else { alert(res.erro || 'Erro ao registrar contagem'); carregarItens(); }
}

async function tentarFinalizar() {
  const faltam = _itens.filter(i => i.saldo_contado == null).length;
  const msg = faltam > 0
    ? `Ainda faltam ${faltam} item(ns) sem contagem — eles vão entrar automaticamente como 0. Confirma finalizar mesmo assim?`
    : 'Finalizar o inventário? Depois disso não dá mais pra contar nenhum item.';
  if (!confirm(msg)) return;

  const res = await api('/inventario/contagem/finalizar', { method: 'POST' });
  if (!res.ok) { alert(res.erro || 'Erro ao finalizar'); return; }
  mostrarTelaFinal(null, res);
}

function mostrarTelaFinal(mensagemCustom, resultado) {
  if (_pollTimer) clearInterval(_pollTimer);
  document.getElementById('telaApp').classList.remove('ativo');
  document.getElementById('telaLogin').classList.add('hidden');
  document.getElementById('telaFinal').classList.add('ativo');
  document.getElementById('telaFinalResumo').textContent = mensagemCustom
    || `Acurácia: ${resultado.acuracia_pct.toFixed(1)}% — ${resultado.divergencias} de ${resultado.total} item(ns) com divergência.`;
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

iniciar();
</script>
</body>
</html>
