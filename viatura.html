<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCA — Viatura</title>
<link rel="icon" type="image/png" href="./icon-v3.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;-webkit-text-size-adjust:100%;}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#0a0a0f;color:#f1f5f9;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:32px;}

.topbar{background:#0f0f17;border-bottom:1px solid #1e1e2e;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.topbar img{height:28px;}
.topbar-title{font-size:13px;color:#475569;}

.container{max-width:520px;margin:0 auto;padding:20px 16px;}

.placa-badge{display:inline-block;font-size:32px;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:3px;background:#141420;border:2px solid #2a2a3e;border-radius:10px;padding:10px 24px;margin-bottom:8px;}
.sub{font-size:12px;color:#475569;margin-bottom:24px;}

/* STATUS GERAL */
.status-geral{border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-weight:600;}
.st-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);}
.st-alerta{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);}
.st-vencido{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);}
.st-icon{font-size:24px;}
.st-text strong{display:block;font-size:14px;}
.st-text span{font-size:12px;color:#94a3b8;font-weight:400;}

/* CARDS */
.card{background:#0f0f17;border:1px solid #1e1e2e;border-radius:12px;margin-bottom:12px;overflow:hidden;}
.card-title{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;padding:14px 16px 0;}
.laudo-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1e1e2e;}
.laudo-row:last-child{border-bottom:none;}
.laudo-tipo{font-size:13px;font-weight:600;flex:1;}
.laudo-venc{font-size:11px;color:#475569;margin-top:2px;}
.laudo-dias{font-size:13px;font-weight:700;min-width:80px;text-align:right;}
.dias-ok{color:#22c55e;}
.dias-alerta{color:#fbbf24;}
.dias-vencido{color:#f87171;}

.equip-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e1e2e;}
.equip-row:last-child{border-bottom:none;}
.equip-label{font-size:13px;font-weight:600;}
.equip-data{font-size:10px;color:#475569;margin-top:2px;}
.equip-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
.equip-tem{background:rgba(34,197,94,.12);color:#22c55e;}
.equip-nao{background:rgba(248,113,113,.1);color:#f87171;}

.loading{text-align:center;padding:60px 24px;color:#475569;}
.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.1);border-top-color:#0ea5e9;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.erro{text-align:center;padding:60px 24px;color:#f87171;}
.erro-icon{font-size:40px;margin-bottom:12px;}

.footer{text-align:center;margin-top:32px;font-size:11px;color:#334155;}
</style>

<style id="gcaIconesCss">
/* Ícones (20/10/2026): no lugar dos emojis, ícones Lucide (ISC) embutidos — sprite #gcaIcones */
svg[class^="ic"]{width:1.1em;height:1.1em;flex-shrink:0;vertical-align:-0.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ic-vermelho{color:#ef4444}.ic-amarelo{color:#eab308}.ic-verde{color:#22c55e}.ic-azul{color:#3b82f6}.ic-cinza{color:#94a3b8}.ic-estrela{color:#f59e0b}
</style>
</head>
<body>
<svg id="gcaIcones" xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="i-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/> <circle cx="7" cy="17" r="2"/> <path d="M9 17h6"/> <circle cx="17" cy="17" r="2"/></symbol><symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></symbol><symbol id="i-circle-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/> <path d="m15 9-6 6"/> <path d="m9 9 6 6"/></symbol><symbol id="i-clipboard-list" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/> <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/> <path d="M12 11h4"/> <path d="M12 16h4"/> <path d="M8 11h.01"/> <path d="M8 16h.01"/></symbol><symbol id="i-file-text" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/> <path d="M14 2v5a1 1 0 0 0 1 1h5"/> <path d="M10 9H8"/> <path d="M16 13H8"/> <path d="M16 17H8"/></symbol><symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/> <path d="m9 12 2 2 4-4"/></symbol><symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/> <path d="M12 9v4"/> <path d="M12 17h.01"/></symbol><symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M12 20h.01"/> <path d="M8.5 16.429a5 5 0 0 1 7 0"/> <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/> <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/> <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/> <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/> <path d="m2 2 20 20"/></symbol></svg>

<div class="topbar">
  <img src="./logo-gca.png" alt="GCA">
  <span class="topbar-title">Portal de Viaturas — GCA Ceneged</span>
</div>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Carregando informações da viatura...</div>
    </div>
  </div>
</div>

<script>
const API = 'https://gca-backend-production.up.railway.app';

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escJs(s) {
  return escHtml(String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}
function safeUrl(u) {
  const s = String(u ?? '').trim();
  if (!s) return '';
  try {
    const parsed = new URL(s, window.location.origin);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return s;
  } catch {}
  return '#';
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name) || '';
}

async function carregar() {
  const placa   = getParam('placa').toUpperCase();
  const unidade = getParam('unidade') || 'marica';
  const el = document.getElementById('content');

  if (!placa) {
    el.innerHTML = `<div class="erro"><div class="erro-icon"><svg class=ic aria-hidden=true><use href=#i-car></use></svg></div><div>Placa não informada.</div></div>`;
    return;
  }

  document.title = `GCA — ${placa}`;

  let data;
  try {
    const res = await fetch(`${API}/laudos/viaturas/${encodeURIComponent(placa)}/public?unidade=${unidade}`);
    data = await res.json();
  } catch (err) {
    // Sem isso, uma falha de rede deixava a página travada pra sempre na tela de
    // "Carregando..." (promise rejeitada sem tratamento nenhum), sem nenhum aviso.
    console.error('[viatura/carregar]', err);
    el.innerHTML = `<div class="erro"><div class="erro-icon"><svg class=ic aria-hidden=true><use href=#i-wifi-off></use></svg></div><div>Erro de conexão. Verifique sua internet e recarregue a página.</div></div>`;
    return;
  }

  if (!data?.ok) {
    el.innerHTML = `<div class="erro"><div class="erro-icon"><svg class=ic aria-hidden=true><use href=#i-circle-x></use></svg></div><div>Erro ao carregar dados da viatura.</div></div>`;
    return;
  }

  const laudos = data.laudos || [];
  const equips = data.equipamentos || [];
  const nomes  = { marica:'Maricá', rio_das_ostras:'Rio das Ostras' };

  // Status geral
  const temVencido = laudos.some(l => l.status === 'VENCIDO');
  const temAlerta  = laudos.some(l => l.status === 'ALERTA');
  const stClass = temVencido ? 'st-vencido' : temAlerta ? 'st-alerta' : 'st-ok';
  const stIcon  = temVencido ? '<svg class=ic aria-hidden=true><use href=#i-circle-x></use></svg>' : temAlerta ? '<svg class=ic aria-hidden=true><use href=#i-triangle-alert></use></svg>' : '<svg class=ic aria-hidden=true><use href=#i-circle-check></use></svg>';
  const stTxt   = temVencido ? 'Laudo(s) Vencido(s)' : temAlerta ? 'Laudos próximos do vencimento' : 'Todos os laudos em dia';

  // Laudos HTML
  const laudosHtml = laudos.length ? laudos.map(l => {
    const diasCls = l.status === 'VENCIDO' ? 'dias-vencido' : l.status === 'ALERTA' ? 'dias-alerta' : 'dias-ok';
    const diasTxt = l.dias < 0 ? `Vencido há ${Math.abs(l.dias)} dias` : `${l.dias} dias restantes`;
    return `<div class="laudo-row">
      <div style="flex:1">
        <div class="laudo-tipo">${escHtml(l.tipo_laudo)}</div>
        <div class="laudo-venc">Vence: ${new Date(l.data_vencimento+'T12:00:00').toLocaleDateString('pt-BR')}</div>
      </div>
      <div class="laudo-dias ${diasCls}">${diasTxt}</div>
      ${l.link_pdf ? `<a href="${escHtml(safeUrl(l.link_pdf))}" target="_blank" style="font-size:20px;text-decoration:none"><svg class=ic aria-hidden=true><use href=#i-file-text></use></svg></a>` : ''}
    </div>`;
  }).join('') : '<div style="padding:16px;font-size:12px;color:#475569;text-align:center">Nenhum laudo cadastrado</div>';

  // Equipamentos HTML
  const equipsHtml = equips.length ? equips.map(eq => `
    <div class="equip-row">
      <div>
        <div class="equip-label">${escHtml(eq.label || eq.tipo)}</div>
        ${eq.tem && eq.data_entrega ? `<div class="equip-data">Entregue em: ${new Date(eq.data_entrega+'T12:00:00').toLocaleDateString('pt-BR')}</div>` : ''}
      </div>
      <span class="equip-status ${eq.tem ? 'equip-tem' : 'equip-nao'}">${eq.tem ? '<svg class=ic aria-hidden=true><use href=#i-circle-check></use></svg> Tem' : '<svg class=ic aria-hidden=true><use href=#i-circle-x></use></svg> Não tem'}</span>
    </div>`).join('') : '<div style="padding:16px;font-size:12px;color:#475569;text-align:center">Sem equipamentos cadastrados</div>';

  el.innerHTML = `
    <div style="margin-bottom:4px">
      <div class="placa-badge">${escHtml(placa)}</div>
    </div>
    <div class="sub">${nomes[unidade] || unidade} · Atualizado em ${new Date().toLocaleDateString('pt-BR')}</div>

    <div class="status-geral ${stClass}">
      <span class="st-icon">${stIcon}</span>
      <div class="st-text">
        <strong style="color:${temVencido?'#f87171':temAlerta?'#fbbf24':'#22c55e'}">${stTxt}</strong>
        <span>${laudos.length} laudo(s) cadastrado(s)</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><svg class=ic aria-hidden=true><use href=#i-clipboard-list></use></svg> Laudos</div>
      ${laudosHtml}
    </div>

    <div class="card">
      <div class="card-title"><svg class=ic aria-hidden=true><use href=#i-shield-check></use></svg> Equipamentos</div>
      ${equipsHtml}
    </div>

    <div class="footer">
      GCA — Sistema de Gestão de Almoxarifado · Ceneged
    </div>`;
}

carregar();
</script>
</body>
</html>
