<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>GCA — Tablet Ceneged</title>
<link rel="icon" type="image/png" href="./icon-v3.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#050508;color:#f1f5f9;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}
canvas{display:block;}

/* ── SETUP (primeira vez) ──────────────────────────────── */
#setup{position:fixed;inset:0;background:#050508;display:flex;align-items:center;justify-content:center;z-index:200;}
.setup-card{background:#0f0f17;border:1px solid #1e1e2e;border-radius:16px;padding:40px;width:360px;text-align:center;}
.setup-logo{height:50px;margin-bottom:24px;}
.setup-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.setup-sub{font-size:13px;color:#475569;margin-bottom:28px;}
.setup-select{width:100%;padding:12px 14px;background:#0a0a0f;border:1px solid #2a2a3e;border-radius:8px;color:#f1f5f9;font-size:15px;font-family:'DM Sans',sans-serif;margin-bottom:16px;outline:none;}
.setup-btn{width:100%;padding:13px;background:#6366f1;color:white;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;}
.setup-btn:hover{background:#4f46e5;}

/* ── TELA DE ESPERA (idle) ─────────────────────────────── */
#idle{position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.idle-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;}

/* Gradientes animados */
.idle-glow{position:absolute;border-radius:50%;filter:blur(80px);animation:floatGlow 8s ease-in-out infinite;}
.g1{width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);top:-200px;left:-200px;animation-delay:0s;}
.g2{width:500px;height:500px;background:radial-gradient(circle,rgba(14,165,233,.14) 0%,transparent 70%);bottom:-150px;right:-150px;animation-delay:-3s;}
.g3{width:400px;height:400px;background:radial-gradient(circle,rgba(168,85,247,.1) 0%,transparent 70%);bottom:20%;left:20%;animation-delay:-6s;}
@keyframes floatGlow{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.1)}66%{transform:translate(-20px,30px) scale(.95)}}

/* Partículas */
.particles{position:absolute;inset:0;}
.particle{position:absolute;width:2px;height:2px;background:rgba(255,255,255,.3);border-radius:50%;animation:particleFloat linear infinite;}
@keyframes particleFloat{from{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.5}to{transform:translateY(-10vh) scale(1);opacity:0}}

/* Logo e texto */
.idle-logo-wrap{position:relative;z-index:2;text-align:center;margin-bottom:36px;}
.idle-logo-ceneged{height:120px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(220,38,38,.25));animation:logoBreath 4s ease-in-out infinite;}
@keyframes logoBreath{0%,100%{filter:drop-shadow(0 0 20px rgba(220,38,38,.2))}50%{filter:drop-shadow(0 0 60px rgba(220,38,38,.45))}}
.idle-system{font-size:12px;color:#1e293b;letter-spacing:4px;text-transform:uppercase;margin-top:10px;}

/* Logo GCA discreta no canto */
.idle-gca{position:fixed;top:20px;left:24px;z-index:10;display:flex;align-items:center;gap:8px;opacity:.35;}
.idle-gca img{height:22px;object-fit:contain;}
.idle-gca span{font-size:10px;font-weight:700;color:#475569;letter-spacing:2px;text-transform:uppercase;}

/* Linha animada */
.idle-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,#6366f1,#0ea5e9,transparent);margin:32px auto;animation:lineScan 3s ease-in-out infinite;}
@keyframes lineScan{0%,100%{width:80px;opacity:.5}50%{width:200px;opacity:1}}

.idle-msg{font-size:15px;color:#1e293b;position:relative;z-index:2;display:flex;align-items:center;gap:10px;}
.idle-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.6);opacity:1}}

.idle-unidade{position:fixed;bottom:24px;left:0;right:0;text-align:center;font-size:11px;color:#1e293b;letter-spacing:2px;text-transform:uppercase;z-index:2;}
.idle-hora{position:fixed;top:24px;right:32px;font-size:28px;font-weight:700;font-family:'DM Mono',monospace;color:#0f172a;z-index:2;}

/* Cards de colaboradores pendentes */
.pendentes-wrap{position:fixed;bottom:0;left:0;right:0;padding:24px 32px;z-index:10;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.colab-card{background:rgba(15,15,23,.95);backdrop-filter:blur(20px);border:1px solid rgba(99,102,241,.4);border-radius:14px;padding:20px 24px;min-width:180px;max-width:220px;cursor:pointer;transition:all .2s;animation:cardSlideIn .4s ease;box-shadow:0 8px 32px rgba(0,0,0,.4);}
@keyframes cardSlideIn{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.colab-card:hover,.colab-card:active{border-color:#6366f1;background:rgba(99,102,241,.12);transform:translateY(-4px);}
.colab-card-icon{font-size:28px;margin-bottom:8px;}
.colab-card-name{font-size:14px;font-weight:700;color:#f1f5f9;line-height:1.3;}
.colab-card-sub{font-size:11px;color:#475569;margin-top:4px;}
.colab-card-badge{display:inline-block;background:rgba(99,102,241,.2);color:#818cf8;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:6px;text-transform:uppercase;letter-spacing:.5px;}

/* ── TELA DE ASSINATURA ──────────────────────────────────── */
#assinatura{position:fixed;inset:0;background:#050508;display:none;flex-direction:column;z-index:100;}

.ass-header{padding:20px 32px;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;gap:16px;flex-shrink:0;}
.ass-header img{height:32px;}
.ass-header-info{flex:1;}
.ass-header-nome{font-size:20px;font-weight:800;}
.ass-header-sub{font-size:12px;color:#475569;margin-top:2px;}
.ass-back{padding:8px 16px;background:transparent;border:1px solid #2a2a3e;border-radius:8px;color:#94a3b8;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.ass-back:hover{border-color:#475569;color:#f1f5f9;}

.ass-body{flex:1;display:grid;grid-template-columns:380px 1fr;gap:0;overflow:hidden;}

/* Itens (coluna esquerda) */
.ass-itens{padding:20px 24px;border-right:1px solid #1e1e2e;overflow-y:auto;}
.ass-itens-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;}
.item-row{padding:12px 0;border-bottom:1px solid #1e1e2e;display:flex;align-items:flex-start;gap:12px;}
.item-row:last-child{border-bottom:none;}
.item-qty{font-size:20px;font-weight:800;color:#6366f1;min-width:36px;text-align:center;}
.item-desc{font-size:13px;font-weight:600;color:#f1f5f9;line-height:1.3;}
.item-mot{font-size:11px;color:#475569;margin-top:2px;}

/* Canvas de assinatura (coluna direita) */
.ass-canvas-wrap{display:flex;flex-direction:column;padding:20px 28px;}
.canvas-title{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.canvas-area{flex:1;position:relative;border:2px dashed #1e1e2e;border-radius:12px;overflow:hidden;cursor:crosshair;background:rgba(255,255,255,.02);}
.canvas-area canvas{position:absolute;inset:0;width:100%;height:100%;}
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#1e293b;pointer-events:none;text-align:center;line-height:1.6;}
.canvas-hint-icon{font-size:36px;margin-bottom:8px;}
.ass-actions{margin-top:16px;display:flex;gap:12px;}
.btn-limpar{flex:1;padding:14px;background:transparent;border:1px solid #2a2a3e;border-radius:10px;color:#94a3b8;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.btn-limpar:hover{border-color:#475569;color:#f1f5f9;}
.btn-confirmar{flex:2;padding:14px;background:#22c55e;border:none;border-radius:10px;color:white;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.btn-confirmar:hover{background:#16a34a;}
.btn-confirmar:disabled{opacity:.5;cursor:not-allowed;}

/* Feedback de sucesso */
#sucesso{position:fixed;inset:0;background:rgba(5,5,8,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:150;text-align:center;}
.suc-icon{font-size:80px;margin-bottom:24px;animation:suc .6s ease;}
@keyframes suc{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.suc-title{font-size:32px;font-weight:800;color:#22c55e;margin-bottom:8px;}
.suc-sub{font-size:16px;color:#475569;}
</style>
</head>
<body>

<!-- ═══ SETUP (primeira vez) ═══ -->
<div id="setup">
  <div class="setup-card">
    <img class="setup-logo" src="https://gustavosilveiragsl-ui.github.io/gca-frontend/logo-ceneged.png" alt="Ceneged">
    <div class="setup-title">Tablet de Assinaturas</div>
    <div class="setup-sub">Selecione a filial deste tablet para iniciar</div>
    <select class="setup-select" id="setupUnidade">
      <option value="">Carregando filiais...</option>
    </select>
    <button class="setup-btn" onclick="confirmarSetup()">Confirmar</button>
  </div>
</div>

<!-- ═══ TELA DE ESPERA (idle) ═══ -->
<div id="idle" style="display:none">
  <div class="idle-bg">
    <div class="idle-glow g1"></div>
    <div class="idle-glow g2"></div>
    <div class="idle-glow g3"></div>
    <div class="particles" id="particles"></div>
  </div>

  <!-- GCA discreto no canto superior esquerdo -->
  <div class="idle-gca">
    <img src="https://i.postimg.cc/hvM5wcMw/LOGOTIPO-GCA.png" alt="GCA">
    <span>Sistema GCA</span>
  </div>

  <div class="idle-hora" id="idleHora">--:--</div>

  <div class="idle-logo-wrap">
    <img class="idle-logo-ceneged" src="https://gustavosilveiragsl-ui.github.io/gca-frontend/logo-ceneged.png" alt="Ceneged">
    <div class="idle-system">Gestão de Almoxarifado</div>
  </div>

  <div class="idle-line"></div>

  <div class="idle-msg">
    <span class="idle-dot"></span>
    <span id="idleStatusTxt" style="color:#1e293b">Aguardando assinaturas...</span>
  </div>

  <div class="pendentes-wrap" id="pendentesWrap"></div>
  <div class="idle-unidade" id="idleUnidade"></div>
</div>

<!-- ═══ TELA DE ASSINATURA ═══ -->
<div id="assinatura">
  <div class="ass-header">
    <img src="https://gustavosilveiragsl-ui.github.io/gca-frontend/logo-ceneged.png" alt="Ceneged" style="height:36px;">
    <img src="https://i.postimg.cc/hvM5wcMw/LOGOTIPO-GCA.png" alt="GCA" style="height:22px;opacity:.4;margin-left:4px;">
    <div class="ass-header-info">
      <div class="ass-header-nome" id="assNome">—</div>
      <div class="ass-header-sub">Confirme o recebimento e assine abaixo</div>
    </div>
    <button class="ass-back" onclick="voltarIdle()">← Voltar</button>
  </div>

  <div class="ass-body">
    <!-- Itens recebidos -->
    <div class="ass-itens">
      <div class="ass-itens-title">Itens recebidos</div>
      <div id="assItensLista"></div>
    </div>

    <!-- Canvas de assinatura -->
    <div class="ass-canvas-wrap">
      <div class="canvas-title">Assinatura digital</div>
      <div class="canvas-area" id="canvasArea">
        <canvas id="sigCanvas"></canvas>
        <div class="canvas-hint" id="canvasHint">
          <div class="canvas-hint-icon">✍️</div>
          Assine aqui com o dedo
        </div>
      </div>
      <div class="ass-actions">
        <button class="btn-limpar" onclick="limparAssinatura()">Limpar</button>
        <button class="btn-confirmar" id="btnConfirmar" onclick="confirmarAssinatura()" disabled>✅ Confirmar Recebimento</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ SUCESSO ═══ -->
<div id="sucesso">
  <div class="suc-icon">✅</div>
  <div class="suc-title">Assinatura confirmada!</div>
  <div class="suc-sub" id="sucNome"></div>
</div>

<script>
const API      = 'http://localhost:3000';
let NOMES      = {};

async function carregarFiliais() {
  try {
    const res = await fetch(`${API}/filiais`);
    const data = await res.json();
    const filiais = data?.data || [];
    const sel = document.getElementById('setupUnidade');
    sel.innerHTML = '<option value="">Selecione a filial...</option>';
    filiais.forEach(f => {
      NOMES[f.id] = f.nome;
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = '📍 ' + f.nome;
      sel.appendChild(opt);
    });
  } catch(e) {
    // Fallback hardcoded
    NOMES = { marica:'Maricá', rio_das_ostras:'Rio das Ostras' };
    const sel = document.getElementById('setupUnidade');
    sel.innerHTML = `<option value="">Selecione a filial...</option>
      <option value="marica">📍 Maricá</option>
      <option value="rio_das_ostras">📍 Rio das Ostras</option>`;
  }
}
let _unidade   = '';
let _pendentes = [];
let _atual     = null; // atendimento em assinatura
let _polling   = null;
let _desenhou  = false;
let _ctx       = null;
let _drawing   = false;

// ── SETUP ──────────────────────────────────────────────────
// Carrega filiais ao abrir setup
(function() {
  const u = localStorage.getItem('tablet_unidade');
  if (!u) carregarFiliais();
})();

function confirmarSetup() {
  const u = document.getElementById('setupUnidade').value;
  if (!u) return alert('Selecione a filial.');
  localStorage.setItem('tablet_unidade', u);
  iniciarTablet(u);
}

function iniciarTablet(unidade) {
  _unidade = unidade;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('idle').style.display  = 'flex';
  document.getElementById('idleUnidade').textContent = NOMES[unidade] || unidade;
  criarParticulas();
  iniciarRelogio();
  iniciarPolling();
}

// ── RELÓGIO ───────────────────────────────────────────────
function iniciarRelogio() {
  function tick() {
    const agora = new Date();
    document.getElementById('idleHora').textContent =
      agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  }
  tick();
  setInterval(tick, 30000);
}

// ── PARTÍCULAS ────────────────────────────────────────────
function criarParticulas() {
  const cont = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left:${Math.random()*100}%;
      animation-duration:${6+Math.random()*10}s;
      animation-delay:${Math.random()*10}s;
      opacity:${.1+Math.random()*.3};
      width:${1+Math.random()*2}px;
      height:${1+Math.random()*2}px;
    `;
    cont.appendChild(p);
  }
}

// ── POLLING ───────────────────────────────────────────────
async function buscarPendentes() {
  try {
    const res  = await fetch(`${API}/atendimentos/tablet/pendentes?unidade=${_unidade}`);
    const data = await res.json();
    if (data?.ok) atualizarPendentes(data.data || []);
  } catch {}
}

function atualizarPendentes(lista) {
  _pendentes = lista;
  const wrap = document.getElementById('pendentesWrap');

  if (!lista.length) {
    wrap.innerHTML = '';
    document.getElementById('idleStatusTxt').textContent = 'Aguardando assinaturas...';
    document.getElementById('idleStatusTxt').style.color = '#1e293b';
    return;
  }

  document.getElementById('idleStatusTxt').textContent = `${lista.length} colaborador(es) aguardando assinatura`;
  document.getElementById('idleStatusTxt').style.color = '#818cf8';

  // Se alguém estava assinando e já não está na fila (assinou pelo link), volta ao idle
  if (_atual && !lista.find(a => a.id === _atual.id)) {
    mostrarSucesso(_atual.nome_colaborador);
  }

  // Renderiza cards
  wrap.innerHTML = lista.map(a => `
    <div class="colab-card" onclick="abrirAssinatura('${a.id}')">
      <div class="colab-card-icon">👤</div>
      <div class="colab-card-name">${a.nome_colaborador}</div>
      <div class="colab-card-sub">${contarItens(a.itens_json)} item(s)</div>
      <span class="colab-card-badge">Toque para assinar</span>
    </div>
  `).join('');
}

function iniciarPolling() {
  buscarPendentes();
  _polling = setInterval(buscarPendentes, 5000);
}

function contarItens(json) {
  try { return JSON.parse(json||'[]').length; } catch { return 0; }
}

// ── TELA DE ASSINATURA ────────────────────────────────────
function abrirAssinatura(id) {
  _atual = _pendentes.find(a => a.id === id);
  if (!_atual) return;

  let itens = [];
  try { itens = JSON.parse(_atual.itens_json || '[]'); } catch {}

  document.getElementById('assNome').textContent = _atual.nome_colaborador;
  document.getElementById('assItensLista').innerHTML = itens.map(it => `
    <div class="item-row">
      <div class="item-qty">${it.quantidade||1}</div>
      <div>
        <div class="item-desc">${it.descricao||it.nome||'—'}</div>
        ${it.motivo?`<div class="item-mot">${it.motivo}</div>`:''}
      </div>
    </div>
  `).join('') || '<div style="color:#475569;font-size:13px;padding:12px 0">Nenhum item registrado</div>';

  // Mostra tela
  document.getElementById('assinatura').style.display = 'flex';
  document.getElementById('idle').style.display = 'none';

  // Prepara canvas
  iniciarCanvas();
}

function voltarIdle() {
  _atual = null;
  document.getElementById('assinatura').style.display = 'none';
  document.getElementById('idle').style.display = 'flex';
  limparAssinatura();
}

// ── CANVAS ────────────────────────────────────────────────
function iniciarCanvas() {
  _desenhou = false;
  const area   = document.getElementById('canvasArea');
  const canvas = document.getElementById('sigCanvas');
  const hint   = document.getElementById('canvasHint');
  canvas.width  = area.offsetWidth;
  canvas.height = area.offsetHeight;
  _ctx = canvas.getContext('2d');
  _ctx.clearRect(0, 0, canvas.width, canvas.height);
  _ctx.strokeStyle = '#f1f5f9';
  _ctx.lineWidth   = 2.5;
  _ctx.lineCap     = 'round';
  _ctx.lineJoin    = 'round';
  document.getElementById('btnConfirmar').disabled = true;
  hint.style.display = '';

  canvas.ontouchstart = (e) => { e.preventDefault(); iniciarLinha(e.touches[0]); };
  canvas.ontouchmove  = (e) => { e.preventDefault(); desenhar(e.touches[0]); };
  canvas.ontouchend   = finalizarLinha;
  canvas.onmousedown  = (e) => iniciarLinha(e);
  canvas.onmousemove  = (e) => { if (_drawing) desenhar(e); };
  canvas.onmouseup    = finalizarLinha;
  canvas.onmouseleave = finalizarLinha;
}

function posCanvas(evt) {
  const r = document.getElementById('sigCanvas').getBoundingClientRect();
  return { x: (evt.clientX - r.left) * (document.getElementById('sigCanvas').width / r.width),
           y: (evt.clientY - r.top)  * (document.getElementById('sigCanvas').height / r.height) };
}

function iniciarLinha(evt) {
  _drawing = true;
  const p = posCanvas(evt);
  _ctx.beginPath(); _ctx.moveTo(p.x, p.y);
  document.getElementById('canvasHint').style.display = 'none';
}

function desenhar(evt) {
  if (!_drawing) return;
  const p = posCanvas(evt);
  _ctx.lineTo(p.x, p.y); _ctx.stroke();
  if (!_desenhou) { _desenhou = true; document.getElementById('btnConfirmar').disabled = false; }
}

function finalizarLinha() { _drawing = false; }

function limparAssinatura() {
  const c = document.getElementById('sigCanvas');
  if (_ctx) _ctx.clearRect(0, 0, c.width, c.height);
  _desenhou = false;
  document.getElementById('btnConfirmar').disabled = true;
  document.getElementById('canvasHint').style.display = '';
}

// ── CONFIRMAR ─────────────────────────────────────────────
async function confirmarAssinatura() {
  if (!_atual || !_desenhou) return;
  const btn = document.getElementById('btnConfirmar');
  btn.disabled = true; btn.textContent = '⏳ Enviando...';

  const canvas   = document.getElementById('sigCanvas');
  const assinSvg = canvas.toDataURL('image/png');

  try {
    const res = await fetch(`${API}/atendimentos/confirmar-assinatura`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _atual.token, assinatura_base64: assinSvg })
    });
    const data = await res.json();

    if (data.ok || data.jaAssinado) {
      const nome = _atual.nome_colaborador;
      _atual = null;
      document.getElementById('assinatura').style.display = 'none';
      mostrarSucesso(nome);
    } else {
      alert('Erro ao confirmar: ' + (data.erro || 'Tente novamente'));
      btn.disabled = false; btn.textContent = '✅ Confirmar Recebimento';
    }
  } catch {
    alert('Erro de conexão. Tente novamente.');
    btn.disabled = false; btn.textContent = '✅ Confirmar Recebimento';
  }
}

// ── SUCESSO ───────────────────────────────────────────────
function mostrarSucesso(nome) {
  document.getElementById('sucNome').textContent = nome || '';
  const el = document.getElementById('sucesso');
  el.style.display = 'flex';
  setTimeout(() => {
    el.style.display = 'none';
    document.getElementById('idle').style.display = 'flex';
  }, 3000);
}

// ── INIT ──────────────────────────────────────────────────
(function init() {
  const u = localStorage.getItem('tablet_unidade');
  if (u) { iniciarTablet(u); }
  // Se ?reset=1 na URL → força setup novamente
  if (new URLSearchParams(window.location.search).get('reset')) {
    localStorage.removeItem('tablet_unidade');
    location.href = location.pathname;
  }
})();
</script>
